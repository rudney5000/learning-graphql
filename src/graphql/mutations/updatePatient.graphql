POST http://localhost:4000/graphql
Content-Type: application/json
X-Request-Type: GraphQL

mutation UpdatePatient(
    $id: ID! 
    $input: UpdatePatientInput!
) {
    updatePatient(
        id: $id 
        input: $input
    ) {
        ...PatientFields
    }
}

